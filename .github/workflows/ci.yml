name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib oleans
        uses: actions/cache@v5
        with:
          path: |
            .lake/packages/mathlib/.lake/build
            ~/.cache/mathlib
          key: mathlib-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: mathlib-

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build --iofail

      - name: Source guard
        run: bash scripts/source-guard.sh

      - name: PR size guard
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: origin/${{ github.base_ref }}
        run: bash scripts/pr-size-guard.sh
